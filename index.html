<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตามรอยป้อมเมืองสิงหนคร</title>

    <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: #f3efe6;
        }

        header {
            background: #263b2d;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin: 0;
        }

        #map {
            height: 75vh;
            width: 100%;
        }

        .info {
            text-align: center;
            padding: 20px;
        }

        button {
            background: #a87938;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>

<body>

<header>
    <h1>ตามรอยป้อมเมืองสิงหนคร</h1>
    <p>แผนที่ประวัติศาสตร์และบอร์ดเกมเพื่อการเรียนรู้</p>
</header>

<div id="map"></div>

<div class="info">
    <h2>สำรวจประวัติศาสตร์เมืองสงขนาเก่า</h2>
    <p>เรียนรู้ตำแหน่งป้อมปราการและเรื่องราวในอดีต</p>
    <button onclick="startGame()">เริ่มเล่นบอร์ดเกม</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // สร้างแผนที่
    var map = L.map('map').setView([7.2192, 100.5568], 14);

    // ภาพดาวเทียม
    L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {
            attribution: 'Tiles © Esri'
        }
    ).addTo(map);

    // ป้อมหมายเลข 9 (พิกัดอ้างอิง)
  var fort9 = L.marker([7.21923658, 100.55681261], {
    icon: L.divIcon({
        className: 'fort-number-icon',
        html: '<div style="background:red;color:white;border:2px solid white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;box-shadow:0 0 5px black;">9</div>',
        iconSize: [34, 34],
        iconAnchor: [17, 17]
    })
})
        .addTo(map);
  fort9.bindPopup(`
    <div style="width:260px;font-family:Arial,sans-serif;">
        <h3 style="color:#8B0000;text-align:center;">
            ป้อมหมายเลข 9
            <img src="https://smartdastaapp.dasta.or.th/place/1640"
     style="width:100%;height:auto;border-radius:8px;"
     alt="ภาพเมืองสงขลาเก่าฝั่งหัวเขาแดง">
        </h3>
        <hr>

        <p><b>สถานที่:</b> เมืองสงขลาเก่า ฝั่งหัวเขาแดง</p>

        <p><b>ความสำคัญทางประวัติศาสตร์</b></p>

        <p style="text-align:justify;">
            เมืองสงขลาเก่าฝั่งหัวเขาแดงเป็นเมืองท่าสำคัญ
            ในอดีต มีการสร้างป้อมปราการเพื่อป้องกันเมือง
            และรักษาความมั่นคงของเมืองท่า
        </p>

        <p><b>พิกัดอ้างอิง</b></p>
        <p>7.21923658, 100.55681261</p>

        <p style="color:#B22222;">
            หมายเหตุ: พิกัดนี้เป็นตำแหน่งอ้างอิง
            ต้องตรวจสอบตำแหน่งป้อมจริงเพิ่มเติม
        </p>

        <hr>

        <p><b>แหล่งข้อมูล:</b></p>
        <p>สำนักทรัพยากรการเรียนรู้คุณหญิงหลงฯ
        มหาวิทยาลัยสงขลานครินทร์</p>

        <a href="https://www.clib.psu.ac.th/southerninfo/content/1/949ce8ac"
           target="_blank">
           อ่านประวัติเมืองสงขลาเก่าเพิ่มเติม
        </a>
    </div>
`);
function createFortMarker(number, lat, lng) {
    var marker = L.marker([lat, lng], {
        icon: L.divIcon({
            className: 'fort-number-icon',
            html: '<div style="background:red;color:white;border:2px solid white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;box-shadow:0 0 5px black;">' + number + '</div>',
            iconSize: [34, 34],
            iconAnchor: [17, 17]
        })
    }).addTo(map);

    marker.bindPopup(`
        <h3>ป้อมหมายเลข ${number}</h3>
        <p>ตำแหน่งทดลองสำหรับแผนที่ป้อมเมืองสงขลา</p>
        <p>พิกัดเบื้องต้น ยังไม่ได้ตรวจสอบภาคสนาม</p>
    `);
}

// หมุดป้อมหมายเลข 1-8 (ตำแหน่งทดลอง)
createFortMarker(1, 7.2200, 100.5560);
createFortMarker(2, 7.2205, 100.5570);
createFortMarker(3, 7.2198, 100.5580);
createFortMarker(4, 7.2190, 100.5575);
createFortMarker(5, 7.2185, 100.5565);
createFortMarker(6, 7.2188, 100.5555);
createFortMarker(7, 7.2195, 100.5550);
createFortMarker(8, 7.2202, 100.5552);
   

    // ปุ่มเริ่มเกม
    function startGame() {
        alert('ยินดีต้อนรับสู่เกมตามรอยป้อมเมืองสิงหนคร!');
    }
</script>

</body>
</html>
